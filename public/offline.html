<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e1f22" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Offline · Antigravity</title>
  <style>
    :root { --bg: #313338; --text: #dbdee1; --muted: #949ba4; --brand: #5865f2; }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f2f3f5; --text: #1e1f22; --muted: #5c5e66; }
    }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
    }
    main { max-width: 360px; text-align: center; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: var(--muted); margin: 0 0 20px; }
    a {
      display: inline-block; background: var(--brand); color: #fff; text-decoration: none;
      padding: 10px 20px; border-radius: 4px; font-weight: 600;
    }
    a:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Antigravity needs a connection to load your servers and messages. Check your network, then try again.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
