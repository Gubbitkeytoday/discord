name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# One run per branch/PR; a newer push cancels the in-flight PR run. Pushes to
# the default branch are never cancelled so every merged commit gets a result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

jobs:
  checks:
    name: Static checks (jsx, parse, a11y, i18n)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: JSX check
        run: npm run jsx:check
      - name: Parse check
        run: npm run parse:check
      - name: Accessibility audit
        run: npm run a11y
      - name: i18n audit
        run: npm run i18n:audit

  build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  test-sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_PORT_BASE: '5200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  test-postgres:
    name: Tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # The official image ships the contrib modules, so pg_trgm is available.
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_PORT_BASE: '5300'
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test
      PGPASSWORD: app
    steps:
      - uses: actions/checkout@v4
      # Until the PostgreSQL backend lands there is no `test:pg` script; skip
      # the remaining steps (job stays green) and say so in the run summary.
      - name: Detect test:pg script
        id: detect
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['test:pg'] ? 0 : 1)"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=PostgreSQL tests skipped::package.json has no \"test:pg\" script yet; this job will run it once it is added."
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: npm ci
        if: steps.detect.outputs.present == 'true'
        run: npm ci
      - name: Enable pg_trgm
        if: steps.detect.outputs.present == 'true'
        run: psql -h localhost -U app -d app_test -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'
      - name: npm run test:pg
        if: steps.detect.outputs.present == 'true'
        run: npm run test:pg

  e2e:
    name: E2E (Playwright / Chromium)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    env:
      E2E_PORT: '4550'
      E2E_SHOTS: ${{ github.workspace }}/e2e-shots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install playwright-core
        run: npm i --no-save playwright-core
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      # playwright-core's own CLI downloads the Chromium revision that matches
      # the library version the harness imports.
      - name: Install Chromium (with system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Install Chromium system deps (browser cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx --no-install playwright-core install-deps chromium
      # scripts/e2e/run.mjs launches the executable at CHROMIUM_PATH
      # (default /opt/pw-browsers/chromium, which does not exist on runners).
      - name: Point harness at Chromium
        run: |
          CHROMIUM_PATH="$(node -p "require('playwright-core').chromium.executablePath()")"
          test -x "$CHROMIUM_PATH"
          echo "CHROMIUM_PATH=$CHROMIUM_PATH" >> "$GITHUB_ENV"
      # With dist/index.html present the harness skips its own vite build.
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: npm run e2e
        run: npm run e2e
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-shots/
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: antigravity-discord:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          # Production config refuses to boot with the dev STORAGE_URL_SECRET.
          docker run -d --name app -p 3001:3001 \
            -e STORAGE_URL_SECRET="$(openssl rand -base64 32)" \
            antigravity-discord:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/live >/dev/null; then
              echo "container is live"
              exit 0
            fi
            sleep 2
          done
          echo "::error::container did not answer /api/live within 60s"
          exit 1
      - name: Container logs
        if: always()
        run: docker logs app 2>&1 | tail -n 100 || true

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Full audit (report only)
        run: npm audit || true
      - name: Fail on critical vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=critical
