name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# One run per branch/PR; a newer push cancels the in-flight PR run. Pushes to
# the default branch are never cancelled so every merged commit gets a result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

jobs:
  checks:
    name: Static checks (jsx, parse, a11y, i18n)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: JSX check
        run: npm run jsx:check
      - name: Parse check
        run: npm run parse:check
      - name: Accessibility audit
        run: npm run a11y
      - name: i18n audit
        run: npm run i18n:audit
      # Every variable the code reads is in .env.example, and DEPLOYMENT.md's
      # environment reference (generated from it) is current.
      - name: Environment reference
        run: npm run env:check
      - name: Shell scripts parse
        run: sh -n scripts/ops/docker-backup.sh

  build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  test-sqlite:
    name: Tests (SQLite, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Node 22 is the current floor, Node 24 LTS is what the image ships.
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    env:
      TEST_PORT_BASE: '5200'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  test-postgres:
    name: Tests (PostgreSQL 16, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    services:
      postgres:
        # The official image ships the contrib modules, so pg_trgm is available.
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_PORT_BASE: '5300'
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test
      PGPASSWORD: app
    steps:
      - uses: actions/checkout@v7
      # Until the PostgreSQL backend lands there is no `test:pg` script; skip
      # the remaining steps (job stays green) and say so in the run summary.
      - name: Detect test:pg script
        id: detect
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['test:pg'] ? 0 : 1)"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=PostgreSQL tests skipped::package.json has no \"test:pg\" script yet; this job will run it once it is added."
          fi
      - uses: actions/setup-node@v7
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: npm ci
        if: steps.detect.outputs.present == 'true'
        run: npm ci
      - name: Enable pg_trgm
        if: steps.detect.outputs.present == 'true'
        run: psql -h localhost -U app -d app_test -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'
      - name: npm run test:pg
        if: steps.detect.outputs.present == 'true'
        run: npm run test:pg

  e2e:
    name: E2E (Playwright / Chromium)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    env:
      E2E_PORT: '4550'
      E2E_SHOTS: ${{ github.workspace }}/e2e-shots
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install playwright-core
        run: npm i --no-save playwright-core
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      # playwright-core's own CLI downloads the Chromium revision that matches
      # the library version the harness imports.
      - name: Install Chromium (with system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Install Chromium system deps (browser cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx --no-install playwright-core install-deps chromium
      # scripts/e2e/run.mjs launches the executable at CHROMIUM_PATH
      # (default /opt/pw-browsers/chromium, which does not exist on runners).
      - name: Point harness at Chromium
        run: |
          CHROMIUM_PATH="$(node -p "require('playwright-core').chromium.executablePath()")"
          test -x "$CHROMIUM_PATH"
          echo "CHROMIUM_PATH=$CHROMIUM_PATH" >> "$GITHUB_ENV"
      # With dist/index.html present the harness skips its own vite build.
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: npm run e2e
        run: npm run e2e
      # The narrower browser suites run even when an earlier one failed, so a
      # single run reports every broken area. Each boots its own server on its
      # own port against the same dist/.
      - name: npm run e2e:integration (passkey sign-in, translate, reconnect catch-up)
        if: success() || failure()
        env:
          E2E_INTEGRATION_PORT: '4552'
        run: npm run e2e:integration
      - name: npm run e2e:passkeys (virtual authenticator round-trip)
        if: success() || failure()
        env:
          E2E_PASSKEY_PORT: '4551'
        run: npm run e2e:passkeys
      - name: npm run e2e:pwa (manifest, service worker, offline shell)
        if: success() || failure()
        env:
          E2E_PWA_PORT: '4560'
        run: npm run e2e:pwa
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e-shots/
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: Docker image (build, SBOM, scan, sign)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write          # push to GHCR (only when REGISTRY_IMAGE is set)
      id-token: write          # keyless cosign signing via GitHub OIDC
      security-events: write   # upload the vulnerability scan as SARIF
    env:
      # Set the repository variable REGISTRY_IMAGE (e.g. ghcr.io/<owner>/antigravity-discord)
      # to publish. Without it the image is built, scanned and discarded.
      REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE }}
      PUBLISH: ${{ vars.REGISTRY_IMAGE != '' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build metadata
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build (load locally)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: antigravity-discord:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
            VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container (read-only root filesystem)
        run: |
          # Production config refuses to boot with the dev STORAGE_URL_SECRET.
          docker run -d --name app -p 3001:3001 --read-only --tmpfs /tmp \
            -e STORAGE_URL_SECRET="$(openssl rand -base64 32)" \
            antigravity-discord:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/live >/dev/null; then
              echo "container is live"
              curl -fsS http://127.0.0.1:3001/api/ready
              test "$(docker inspect -f '{{.Config.User}}' app)" != "" || { echo "::error::image runs as root"; exit 1; }
              exit 0
            fi
            sleep 2
          done
          echo "::error::container did not answer /api/live within 60s"
          exit 1
      - name: Container logs
        if: always()
        run: docker logs app 2>&1 | tail -n 100 || true

      # --- supply chain ---------------------------------------------------------
      - name: SBOM (syft, SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          image: antigravity-discord:ci
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-${{ steps.meta.outputs.sha }}.spdx.json
      - name: Vulnerability scan (grype)
        id: scan
        uses: anchore/scan-action@v7
        with:
          image: antigravity-discord:ci
          # Fail on critical vulnerabilities that have a fix available: those
          # are actionable (bump the base image or the dependency).
          severity-cutoff: critical
          only-fixed: true
          fail-build: true
          output-format: sarif
      # The SARIF above only lands in the Security tab. Print the same findings
      # as a table in the log (and the run summary) so a failed gate says which
      # package to bump without a trip to the Security tab.
      - name: Vulnerability table (grype)
        if: always()
        id: grype-bin
        uses: anchore/scan-action/download-grype@v7
      - name: Print grype findings
        if: always() && steps.grype-bin.outputs.cmd != ''
        env:
          GRYPE: ${{ steps.grype-bin.outputs.cmd }}
        run: |
          "$GRYPE" antigravity-discord:ci --only-fixed -o table | tee grype-table.txt || true
          {
            echo "### grype (fixable findings)"
            echo '```'
            cat grype-table.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload scan results
        if: always() && steps.scan.outputs.sarif != ''
        # Pull requests from forks get a read-only token; the scan itself
        # still gates the build.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: container-image

      # --- publish + sign (main only, and only with a registry configured) ------
      - name: Log in to the registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ startsWith(vars.REGISTRY_IMAGE, 'ghcr.io/') && 'ghcr.io' || vars.REGISTRY_HOST }}
          username: ${{ startsWith(vars.REGISTRY_IMAGE, 'ghcr.io/') && github.actor || secrets.REGISTRY_USERNAME }}
          password: ${{ startsWith(vars.REGISTRY_IMAGE, 'ghcr.io/') && secrets.GITHUB_TOKEN || secrets.REGISTRY_PASSWORD }}
      - name: Push
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.sha }}
            ${{ env.REGISTRY_IMAGE }}:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
            VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
      - uses: sigstore/cosign-installer@v3
        if: env.PUBLISH == 'true'
      - name: Sign image and attach SBOM (keyless)
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          ref="${REGISTRY_IMAGE}@${DIGEST}"
          cosign sign --yes "$ref"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$ref"
          {
            echo "### Published"
            echo "\`$ref\`"
            echo
            echo "Verify: \`cosign verify $ref --certificate-identity-regexp '^${{ github.server_url }}/${{ github.repository }}/' --certificate-oidc-issuer https://token.actions.githubusercontent.com\`"
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Full audit (report only)
        run: npm audit || true
      - name: Fail on critical vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=critical

  prod-deps:
    name: Production dependencies boot (npm ci --omit=dev)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Docker image prunes devDependencies after `npm run build`. This proves
    # the server needs nothing from devDependencies (client-only packages such
    # as react, vite or tailwindcss must stay there) without building an image.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --omit=dev
      - name: No build tooling in the production tree
        run: |
          for pkg in vite esbuild react react-dom tailwindcss; do
            if [ -e "node_modules/$pkg" ]; then echo "::error::$pkg is in production dependencies"; exit 1; fi
          done
      - name: Boot in production mode and answer /api/live
        run: |
          mkdir -p dist && echo '<!doctype html><title>stub</title>' > dist/index.html
          NODE_ENV=production PORT=3099 STORAGE_URL_SECRET="$(openssl rand -base64 32)" \
            DB_PATH="$RUNNER_TEMP/ci.db" STORAGE_ROOT="$RUNNER_TEMP/uploads" \
            node server.js > server.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3099/api/live >/dev/null; then echo "live"; exit 0; fi
            sleep 1
          done
          cat server.log; exit 1

  compose:
    name: docker compose config (every profile)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Refuses to start without POSTGRES_PASSWORD
        run: |
          cp .env.example .env
          if docker compose config -q 2>err.txt; then
            echo "::error::compose accepted an empty POSTGRES_PASSWORD"; exit 1
          fi
          grep -q POSTGRES_PASSWORD err.txt
      - name: Validate each profile
        run: |
          cp .env.example .env
          {
            echo "POSTGRES_PASSWORD=ci-postgres-password"
            echo "STORAGE_URL_SECRET=ci-storage-url-secret-0123456789abcdef"
            echo "TURN_SECRET=ci-turn-secret-0123456789abcdef"
            echo "LIVEKIT_API_KEY=ci-livekit-key"
            echo "LIVEKIT_API_SECRET=ci-livekit-secret-0123456789abcdef0123456789"
            echo "DOMAIN=chat.example.com"
          } >> .env
          for profile in "" turn livekit scale translate observability no-proxy; do
            echo "::group::profile '${profile:-default}'"
            if [ -n "$profile" ]; then docker compose --profile "$profile" config -q; else docker compose config -q; fi
            echo "::endgroup::"
          done
          docker compose --profile turn --profile livekit --profile scale --profile translate --profile observability config -q
