# ============================================================================
#  Antigravity Discord — production stack
#
#  The app, and Caddy in front of it for automatic HTTPS. Caddy is the reason
#  this is worth using compose at all — a WebSocket app needs TLS and correct
#  forwarded headers, and getting a certificate by hand is the step most likely
#  to be skipped. (Browsers also refuse microphone access on plain http.)
#
#  Optional third service: coturn, the TURN relay voice and video need for
#  users behind symmetric NAT / CGNAT / strict firewalls. Enable it with the
#  `turn` profile — see DEPLOYMENT.md, "Voice and video: TURN".
#
#  The database is PostgreSQL (the `postgres` service). The app creates and
#  migrates the schema itself on boot, and waits for Postgres to be healthy.
#  To keep SQLite instead, set `DATABASE_URL=` (empty) in .env — the app then
#  uses /data/discord.db and the postgres service can be removed.
#
#  First run:
#    cp .env.example .env      # then edit: PUBLIC_URL, STORAGE_URL_SECRET, DOMAIN,
#                              # POSTGRES_PASSWORD (URL-safe characters only)
#    docker compose up -d                       # or: --profile turn up -d
#    docker compose exec app node db/seed.js    # optional demo data
#
#  Moving an existing SQLite deployment over: DEPLOYMENT.md, "PostgreSQL".
# ============================================================================

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      SERVE_STATIC: 1
      LOG_FORMAT: json
      # Caddy is the only thing in front of the app, so exactly one hop of
      # X-Forwarded-For is trustworthy. Trusting more would let a client forge
      # its own IP and escape rate limiting.
      TRUST_PROXY: 1
      # PostgreSQL by default. `${VAR-default}` keeps an explicitly empty
      # DATABASE_URL= from .env, which switches the app back to SQLite.
      DATABASE_URL: ${DATABASE_URL-postgres://antigravity:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/antigravity}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_PATH: /data/discord.db
      STORAGE_ROOT: /data/uploads
      BACKUP_DIR: /backups
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app-data:/data
      # Separate from the data volume so deleting one cannot take the other.
      # Copy it off the host too — a backup on the same disk is not a backup.
      - app-backups:/backups
    expose:
      - "3001"
    # Not published to the host: only Caddy may reach it.
    networks:
      - edge
    # server.js drains in-flight requests and closes the database on SIGTERM.
    stop_grace_period: 30s
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: antigravity
      POSTGRES_DB: antigravity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # scram-sha-256 for every connection, including the first.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --encoding=UTF8"
    # Modest settings for a small VM; see DEPLOYMENT.md "Tuning" before
    # raising them. max_connections must exceed DB_POOL_MAX × app instances.
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - log_min_duration_statement=1000
    volumes:
      - pg-data:/var/lib/postgresql/data
      # pg_dump snapshots land next to the app's backups.
      - app-backups:/backups
    # Never published: only the app reaches it, over the internal network.
    expose:
      - "5432"
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antigravity -d antigravity -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # Postgres needs time to checkpoint on shutdown.
    stop_grace_period: 60s
    shm_size: 256mb
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      # Set DOMAIN in .env. Use `localhost` to get a local self-signed cert
      # instead of a public ACME certificate.
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"     # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data           # certificates — losing this re-issues them
      - caddy-config:/config
    networks:
      - edge
    logging: *logging

  # TURN relay. Host networking because a relay allocates one UDP port per
  # participant from a range; publishing thousands of ports through Docker's
  # proxy is slow and fragile. Open 3478/udp+tcp, 5349/tcp and the relay range
  # (49160-49200/udp below) in the host firewall / cloud security group.
  #
  # Uses the TURN REST shared secret: the app mints short-lived credentials per
  # user (GET /api/voice/ice-servers), so no static password ships to browsers.
  coturn:
    image: coturn/coturn:4.6
    profiles: ["turn"]
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_REALM: ${DOMAIN:-localhost}
      # Set to the host's public IP when it sits behind 1:1 NAT (AWS, GCP…):
      #   TURN_EXTERNAL_IP=203.0.113.10   or   203.0.113.10/10.0.0.5
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
    # A shell wrapper so a missing secret fails loudly instead of starting an
    # open relay, and so the external IP is only passed when it is set.
    # ($$ escapes compose interpolation; the container's shell expands these.)
    entrypoint: ["sh", "-c"]
    command:
      - >-
        test -n "$$TURN_SECRET" || { echo "coturn: TURN_SECRET is not set" >&2; exit 1; };
        exec turnserver -n --log-file=stdout --fingerprint
        --use-auth-secret --static-auth-secret="$$TURN_SECRET" --realm="$$TURN_REALM"
        --listening-port=3478 --tls-listening-port=5349
        --min-port=49160 --max-port=49200
        $${TURN_EXTERNAL_IP:+--external-ip=$$TURN_EXTERNAL_IP}
        --no-cli --no-multicast-peers
        --denied-peer-ip=0.0.0.0-0.255.255.255
        --denied-peer-ip=10.0.0.0-10.255.255.255
        --denied-peer-ip=100.64.0.0-100.127.255.255
        --denied-peer-ip=127.0.0.0-127.255.255.255
        --denied-peer-ip=169.254.0.0-169.254.255.255
        --denied-peer-ip=172.16.0.0-172.31.255.255
        --denied-peer-ip=192.168.0.0-192.168.255.255
        --total-quota=300 --stale-nonce=600
    logging: *logging

  # --- observability profile ---------------------------------------------------
  # Grafana + Tempo (traces) + Loki (logs) + Prometheus (metrics) + an
  # OpenTelemetry Collector in one container, with the Antigravity dashboard
  # and alert rules pre-provisioned from ops/. Enable with:
  #
  #   docker compose --profile observability up -d
  #   # and in .env: OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318
  #   #              GRAFANA_ADMIN_PASSWORD=<something long>
  #
  # Grafana listens on 127.0.0.1:3000 only; reach it over an SSH tunnel
  # (ssh -L 3000:127.0.0.1:3000 host) rather than publishing it. OTLP ports are
  # not published: only the app, on the internal network, sends to them.
  # Sized for one small node (it keeps ~15 days by default); for anything
  # bigger, point OTEL_EXPORTER_OTLP_ENDPOINT at a managed backend instead.
  # See DEPLOYMENT.md, "Observability".
  lgtm:
    image: grafana/otel-lgtm:0.34.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: admin
      # `:-` rather than `:?` so compose still parses without this profile;
      # the entrypoint below refuses to start Grafana with no password.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    entrypoint: ["bash", "-c"]
    command:
      - >-
        test -n "$$GF_SECURITY_ADMIN_PASSWORD" || { echo "lgtm: GRAFANA_ADMIN_PASSWORD is not set" >&2; exit 1; };
        exec /otel-lgtm/run-all.sh
    ports:
      - "127.0.0.1:3000:3000"
    expose:
      - "4317"
      - "4318"
    volumes:
      - lgtm-data:/data
      - ./ops/grafana/provisioning/dashboards.yml:/otel-lgtm/grafana/conf/provisioning/dashboards/antigravity.yml:ro
      - ./ops/grafana/dashboards:/otel-lgtm/antigravity-dashboards:ro
      - ./ops/alerts/grafana-alerting.yml:/otel-lgtm/grafana/conf/provisioning/alerting/antigravity.yml:ro
    networks:
      - edge
    logging: *logging
  # --- end observability profile -----------------------------------------------

volumes:
  app-data:
  app-backups:
  pg-data:
  caddy-data:
  caddy-config:
  lgtm-data:        # observability profile

networks:
  edge:
