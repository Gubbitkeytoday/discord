# ============================================================================
#  Grafana-managed alert rules (file provisioning) for the compose
#  `observability` profile. Mirrors ops/alerts/antigravity.rules.yml.
#
#  Mounted into grafana/otel-lgtm at
#    /otel-lgtm/grafana/conf/provisioning/alerting/antigravity.yml
#  Rules land in the "Antigravity" folder; notifications go to Grafana's
#  default contact point until you add one (Alerting → Contact points), e.g.
#  e-mail, Slack, a webhook or an on-call tool.
#  Keep it in step with antigravity.rules.yml when changing a threshold.
# ============================================================================
apiVersion: 1
groups:
- orgId: 1
  name: antigravity
  folder: Antigravity
  interval: 1m
  rules:
  - uid: ag-down
    title: AntigravityDown
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: absent_over_time(app_socket_connections[5m])
        instant: true
        intervalMs: 60000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 0m
    labels:
      severity: page
      service: antigravity-discord
    annotations:
      summary: No telemetry from Antigravity Discord for 5 minutes
      runbook_url: ops/runbooks/db-down.md
      description: Same rule as ops/alerts/antigravity.rules.yml (Prometheus format).
    isPaused: false
  - uid: ag-5xx
    title: AntigravityHighErrorRate
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: sum(rate(app_http_request_duration_seconds_count{status_code=~"5.."}[5m])) / clamp_min(sum(rate(app_http_request_duration_seconds_count[5m])), 1e-9)
        instant: true
        intervalMs: 60000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.05
    noDataState: OK
    execErrState: Error
    for: 10m
    labels:
      severity: page
      service: antigravity-discord
    annotations:
      summary: More than 5% of requests fail with 5xx
      runbook_url: ops/runbooks/high-latency.md
      description: Same rule as ops/alerts/antigravity.rules.yml (Prometheus format).
    isPaused: false
  - uid: ag-p95
    title: AntigravityHighLatency
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: histogram_quantile(0.95, sum by (le) (rate(app_http_request_duration_seconds_bucket[5m])))
        instant: true
        intervalMs: 60000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 1
    noDataState: OK
    execErrState: Error
    for: 10m
    labels:
      severity: page
      service: antigravity-discord
    annotations:
      summary: p95 HTTP latency above 1 s
      runbook_url: ops/runbooks/high-latency.md
      description: Same rule as ops/alerts/antigravity.rules.yml (Prometheus format).
    isPaused: false
  - uid: ag-dberr
    title: AntigravityDatabaseErrors
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: sum(rate(app_db_query_errors_total[5m]))
        instant: true
        intervalMs: 60000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.5
    noDataState: OK
    execErrState: Error
    for: 5m
    labels:
      severity: page
      service: antigravity-discord
    annotations:
      summary: Database calls are failing
      runbook_url: ops/runbooks/db-down.md
      description: Same rule as ops/alerts/antigravity.rules.yml (Prometheus format).
    isPaused: false
  - uid: ag-loop
    title: AntigravityEventLoopLag
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max(nodejs_eventloop_lag_seconds)
        instant: true
        intervalMs: 60000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.2
    noDataState: OK
    execErrState: Error
    for: 5m
    labels:
      severity: ticket
      service: antigravity-discord
    annotations:
      summary: Node.js event loop lagging
      runbook_url: ops/runbooks/high-latency.md
      description: Same rule as ops/alerts/antigravity.rules.yml (Prometheus format).
    isPaused: false
  - uid: ag-slowdb
    title: AntigravitySlowQueries
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: histogram_quantile(0.95, sum by (le) (rate(app_db_query_duration_seconds_bucket[5m])))
        instant: true
        intervalMs: 60000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.25
    noDataState: OK
    execErrState: Error
    for: 15m
    labels:
      severity: ticket
      service: antigravity-discord
    annotations:
      summary: p95 database call above 250 ms
      runbook_url: ops/runbooks/high-latency.md
      description: Same rule as ops/alerts/antigravity.rules.yml (Prometheus format).
    isPaused: false
  - uid: ag-pool
    title: AntigravityDbPoolSaturated
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max(app_db_pool_connections{state="waiting"})
        instant: true
        intervalMs: 60000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 5m
    labels:
      severity: ticket
      service: antigravity-discord
    annotations:
      summary: Requests are queueing for a PostgreSQL connection
      runbook_url: ops/runbooks/high-latency.md
      description: Same rule as ops/alerts/antigravity.rules.yml (Prometheus format).
    isPaused: false
  - uid: ag-disk
    title: AntigravityDiskLow
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: min by (volume) (app_disk_free_bytes / app_disk_total_bytes)
        instant: true
        intervalMs: 60000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 0.1
    noDataState: OK
    execErrState: Error
    for: 15m
    labels:
      severity: ticket
      service: antigravity-discord
    annotations:
      summary: Less than 10% disk free on a data volume
      runbook_url: ops/runbooks/disk-full.md
      description: Same rule as ops/alerts/antigravity.rules.yml (Prometheus format).
    isPaused: false
  - uid: ag-diskcrit
    title: AntigravityDiskCritical
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: min by (volume) (app_disk_free_bytes / app_disk_total_bytes)
        instant: true
        intervalMs: 60000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 0.03
    noDataState: OK
    execErrState: Error
    for: 5m
    labels:
      severity: page
      service: antigravity-discord
    annotations:
      summary: Disk almost full — uploads and SQLite writes will fail
      runbook_url: ops/runbooks/disk-full.md
      description: Same rule as ops/alerts/antigravity.rules.yml (Prometheus format).
    isPaused: false
